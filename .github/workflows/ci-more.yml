name: CI more folders

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: "backend"
    # The multi-tenant API tests run against real databases. The host ports match the test defaults.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: miniworld_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d miniworld_saas"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mongo:
        image: mongo:7
        ports:
          - 57017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 3s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "backend/package-lock.json"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test (unit, API and migration suites)
        run: npm test
      - name: Mutation check (each guard deleted in turn, a test must fail)
        run: npm run test:mutation
  node-creator-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "creator-dashboard"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "creator-dashboard/package-lock.json"
      - name: Compile contracts (the sdk build reads their ABI)
        working-directory: contracts
        run: |
          npm ci
          npx hardhat compile
      - name: Build the sdk (imported from sdk/dist)
        working-directory: sdk
        run: |
          npm ci
          npm run build
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
  node-game-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "game-client"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "game-client/package-lock.json"
      - name: Compile contracts (the sdk build reads their ABI)
        working-directory: contracts
        run: |
          npm ci
          npx hardhat compile
      - name: Build the sdk (imported from sdk/dist)
        working-directory: sdk
        run: |
          npm ci
          npm run build
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
  node-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "sdk"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "sdk/package-lock.json"
      - name: Compile contracts (the sdk build reads their ABI)
        working-directory: contracts
        run: |
          npm ci
          npx hardhat compile
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
